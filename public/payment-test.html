<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sybau Picture - 支付测试工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading {
            display: none;
        }
        .loading.active {
            display: block;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-4xl mx-auto">
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h1 class="text-3xl font-bold text-gray-800 mb-6">🔧 支付系统测试工具</h1>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- 快速测试 -->
                    <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
                        <h2 class="text-xl font-semibold text-blue-800 mb-4">⚡ 快速测试</h2>
                        <div class="space-y-3">
                            <button onclick="window.open('/auth/signin', '_blank')" 
                                class="w-full bg-red-600 text-white py-2 px-4 rounded hover:bg-red-700 transition-colors">
                                🔐 登录账户
                            </button>
                            <button onclick="testPaymentDebug()" 
                                class="w-full bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700 transition-colors">
                                测试支付系统
                            </button>
                            <button onclick="testSubscriptionStatus()" 
                                class="w-full bg-green-600 text-white py-2 px-4 rounded hover:bg-green-700 transition-colors">
                                检查订阅状态
                            </button>
                            <button onclick="testUsageAPI()" 
                                class="w-full bg-purple-600 text-white py-2 px-4 rounded hover:bg-purple-700 transition-colors">
                                测试使用量API
                            </button>
                            <button onclick="testDatabaseConnection()" 
                                class="w-full bg-orange-600 text-white py-2 px-4 rounded hover:bg-orange-700 transition-colors">
                                🗄️ 检查数据库
                            </button>
                            <button onclick="fixDatabaseConnection()" 
                                class="w-full bg-red-700 text-white py-2 px-4 rounded hover:bg-red-800 transition-colors">
                                🔧 修复数据库
                            </button>
                            <button onclick="testPaymentFlow()" 
                                class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white py-2 px-4 rounded hover:from-purple-700 hover:to-pink-700 transition-colors">
                                💳 测试支付流程
                            </button>
                            <button onclick="syncUserManually()" 
                                class="w-full bg-yellow-600 text-white py-2 px-4 rounded hover:bg-yellow-700 transition-colors">
                                🔧 手动同步用户
                            </button>
                            <button onclick="diagnoseOAuthFlow()" 
                                class="w-full bg-indigo-600 text-white py-2 px-4 rounded hover:bg-indigo-700 transition-colors">
                                🔍 OAuth流程诊断
                            </button>
                        </div>
                    </div>

                    <!-- 状态显示 -->
                    <div class="bg-gray-50 border border-gray-200 rounded-lg p-4">
                        <h2 class="text-xl font-semibold text-gray-800 mb-4">📊 系统状态</h2>
                        <div id="statusDisplay" class="text-sm text-gray-600">
                            点击测试按钮查看状态...
                        </div>
                    </div>
                </div>

                <!-- 测试结果 -->
                <div class="mt-8">
                    <h2 class="text-2xl font-semibold text-gray-800 mb-4">📋 测试结果</h2>
                    <div id="testResults" class="bg-gray-100 rounded-lg p-4 min-h-[200px] overflow-auto">
                        <div class="text-gray-500 text-center py-8">
                            等待测试结果...
                        </div>
                    </div>
                </div>

                <!-- 加载指示器 -->
                <div id="loadingIndicator" class="loading fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-white rounded-lg shadow-lg p-6">
                    <div class="flex items-center space-x-3">
                        <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-600"></div>
                        <span class="text-gray-700">测试中...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 显示加载指示器
        function showLoading() {
            document.getElementById('loadingIndicator').classList.add('active');
        }

        // 隐藏加载指示器
        function hideLoading() {
            document.getElementById('loadingIndicator').classList.remove('active');
        }

        // 更新状态显示
        function updateStatus(message, type = 'info') {
            const statusDisplay = document.getElementById('statusDisplay');
            const colors = {
                info: 'text-blue-600',
                success: 'text-green-600',
                error: 'text-red-600',
                warning: 'text-yellow-600'
            };
            statusDisplay.className = `text-sm ${colors[type] || 'text-gray-600'}`;
            statusDisplay.textContent = message;
        }

        // 添加测试结果
        function addTestResult(title, data, success = true) {
            const resultsDiv = document.getElementById('testResults');
            const resultItem = document.createElement('div');
            resultItem.className = `mb-4 p-4 rounded-lg border ${success ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`;
            
            const timestamp = new Date().toLocaleTimeString();
            resultItem.innerHTML = `
                <div class="flex justify-between items-start mb-2">
                    <h3 class="font-semibold ${success ? 'text-green-800' : 'text-red-800'}">${title}</h3>
                    <span class="text-sm text-gray-500">${timestamp}</span>
                </div>
                <pre class="text-sm ${success ? 'text-green-700' : 'text-red-700'} bg-white p-2 rounded overflow-x-auto">${JSON.stringify(data, null, 2)}</pre>
            `;
            
            if (resultsDiv.children.length === 1 && resultsDiv.children[0].textContent.includes('等待测试结果')) {
                resultsDiv.innerHTML = '';
            }
            
            resultsDiv.insertBefore(resultItem, resultsDiv.firstChild);
        }

        

        // 检查登录状态
        async function checkAuthStatus() {
            try {
                const response = await fetch('/api/auth/session');
                const session = await response.json();
                
                if (session && session.user) {
                    updateStatus(`✅ 已登录：${session.user.email}`, 'success');
                    return true;
                } else {
                    updateStatus('❌ 未登录，请先登录后再进行测试', 'error');
                    addTestResult('登录状态检查', {
                        status: 'not_logged_in',
                        message: '请先登录您的Google账户',
                        login_url: '/auth/signin'
                    }, false);
                    return false;
                }
            } catch (error) {
                updateStatus('⚠️ 无法检查登录状态', 'warning');
                return false;
            }
        }

        // 修改测试函数，先检查登录状态
        async function testPaymentDebug() {
            showLoading();
            
            // 先检查登录状态
            const isLoggedIn = await checkAuthStatus();
            if (!isLoggedIn) {
                hideLoading();
                return;
            }
            
            updateStatus('正在测试支付系统...', 'info');
            
            try {
                const response = await fetch('/api/debug/payment');
                const data = await response.json();
                
                if (response.ok) {
                    updateStatus('✅ 支付系统测试完成', 'success');
                    addTestResult('支付系统调试', data, true);
                } else {
                    updateStatus('❌ 支付系统测试失败', 'error');
                    addTestResult('支付系统调试', data, false);
                }
            } catch (error) {
                updateStatus('❌ 支付系统连接失败', 'error');
                addTestResult('支付系统调试', { error: error.message }, false);
            } finally {
                hideLoading();
            }
        }

        // 修改订阅状态测试
        async function testSubscriptionStatus() {
            showLoading();
            
            // 先检查登录状态
            const isLoggedIn = await checkAuthStatus();
            if (!isLoggedIn) {
                hideLoading();
                return;
            }
            
            updateStatus('正在检查订阅状态...', 'info');
            
            try {
                const response = await fetch('/api/user/subscription-status');
                const data = await response.json();
                
                if (response.ok) {
                    updateStatus('✅ 订阅状态检查完成', 'success');
                    addTestResult('订阅状态检查', data, true);
                } else {
                    updateStatus('❌ 订阅状态检查失败', 'error');
                    addTestResult('订阅状态检查', data, false);
                }
            } catch (error) {
                updateStatus('❌ 订阅状态连接失败', 'error');
                addTestResult('订阅状态检查', { error: error.message }, false);
            } finally {
                hideLoading();
            }
        }

        // 修改使用量API测试
        async function testUsageAPI() {
            showLoading();
            
            // 先检查登录状态
            const isLoggedIn = await checkAuthStatus();
            if (!isLoggedIn) {
                hideLoading();
                return;
            }
            
            updateStatus('正在测试使用量API...', 'info');
            
            try {
                const response = await fetch('/api/user/usage');
                const data = await response.json();
                
                if (response.ok) {
                    updateStatus('✅ 使用量API测试完成', 'success');
                    addTestResult('使用量API测试', data, true);
                } else {
                    updateStatus('❌ 使用量API测试失败', 'error');
                    addTestResult('使用量API测试', data, false);
                }
            } catch (error) {
                updateStatus('❌ 使用量API连接失败', 'error');
                addTestResult('使用量API测试', { error: error.message }, false);
            } finally {
                hideLoading();
            }
        }

                                   // 测试数据库连接
         async function testDatabaseConnection() {
             showLoading();
             updateStatus('正在检查数据库连接...', 'info');
             
             try {
                 const response = await fetch('/api/debug/database');
                 const data = await response.json();
                 
                 if (response.ok && data.success) {
                     updateStatus('✅ 数据库连接正常', 'success');
                     addTestResult('数据库连接检查', data, true);
                 } else {
                     updateStatus('❌ 数据库连接失败', 'error');
                     addTestResult('数据库连接检查', data, false);
                 }
             } catch (error) {
                 updateStatus('❌ 数据库检查失败', 'error');
                 addTestResult('数据库连接检查', { error: error.message }, false);
             } finally {
                 hideLoading();
             }
         }

         // 修复数据库连接
         async function fixDatabaseConnection() {
             showLoading();
             updateStatus('正在尝试修复数据库...', 'warning');
             
             try {
                 const response = await fetch('/api/debug/database-fix', {
                     method: 'POST',
                     headers: {
                         'Content-Type': 'application/json'
                     }
                 });
                 const data = await response.json();
                 
                 if (response.ok && data.success) {
                     updateStatus('✅ 数据库修复检查完成', 'success');
                     addTestResult('数据库修复', data, true);
                 } else {
                     updateStatus('❌ 数据库修复失败', 'error');
                     addTestResult('数据库修复', data, false);
                 }
             } catch (error) {
                 updateStatus('❌ 数据库修复检查失败', 'error');
                 addTestResult('数据库修复', { error: error.message }, false);
             } finally {
                 hideLoading();
             }
         }

         // 测试支付流程
         async function testPaymentFlow() {
             showLoading();
             
             // 先检查登录状态
             const isLoggedIn = await checkAuthStatus();
             if (!isLoggedIn) {
                 hideLoading();
                 return;
             }
             
             updateStatus('正在测试支付流程...', 'info');
             
             try {
                 // 模拟创建支付会话
                 const paymentData = {
                     planType: 'pro',
                     billingCycle: 'monthly'
                 };
                 
                 const response = await fetch('/api/payment/create-checkout-session', {
                     method: 'POST',
                     headers: {
                         'Content-Type': 'application/json',
                     },
                     body: JSON.stringify(paymentData)
                 });
                 
                 const data = await response.json();
                 
                 if (response.ok) {
                     updateStatus('✅ 支付流程测试完成', 'success');
                     addTestResult('支付流程测试', {
                         status: 'success',
                         sessionId: data.sessionId,
                         checkoutUrl: data.url,
                         message: '支付会话创建成功（未实际跳转）'
                     }, true);
                 } else {
                     updateStatus('❌ 支付流程测试失败', 'error');
                     addTestResult('支付流程测试', {
                         status: 'failed',
                         error: data.error,
                         details: data.details,
                         timestamp: data.timestamp
                     }, false);
                 }
             } catch (error) {
                 updateStatus('❌ 支付流程连接失败', 'error');
                 addTestResult('支付流程测试', { 
                     status: 'connection_failed',
                     error: error.message 
                 }, false);
             } finally {
                 hideLoading();
             }
         }

         // 手动同步用户
         async function syncUserManually() {
             showLoading();
             
             // 先检查登录状态
             const isLoggedIn = await checkAuthStatus();
             if (!isLoggedIn) {
                 hideLoading();
                 return;
             }
             
             updateStatus('正在手动同步用户...', 'info');
             
             try {
                 const response = await fetch('/api/user/sync-manual', {
                     method: 'POST',
                     headers: {
                         'Content-Type': 'application/json',
                     }
                 });
                 
                 const data = await response.json();
                 
                 if (response.ok && data.success) {
                     updateStatus('✅ 用户同步成功', 'success');
                     addTestResult('手动用户同步', {
                         status: 'success',
                         message: data.message,
                         user: data.user
                     }, true);
                 } else {
                     updateStatus('❌ 用户同步失败', 'error');
                     addTestResult('手动用户同步', {
                         status: 'failed',
                         error: data.error,
                         details: data.details
                     }, false);
                 }
             } catch (error) {
                 updateStatus('❌ 用户同步连接失败', 'error');
                 addTestResult('手动用户同步', { 
                     status: 'connection_failed',
                     error: error.message 
                 }, false);
             } finally {
                 hideLoading();
             }
         }

         // OAuth流程诊断
         async function diagnoseOAuthFlow() {
             showLoading();
             updateStatus('正在诊断OAuth流程...', 'info');
             
             try {
                 const response = await fetch('/api/debug/oauth-flow');
                 const data = await response.json();
                 
                 if (response.ok && data.success) {
                     updateStatus('✅ OAuth流程诊断完成', 'success');
                     addTestResult('OAuth流程诊断', {
                         ...data.diagnostics,
                         recommendations: data.recommendations,
                         analysis: {
                             hasYouTubeIssue: data.diagnostics.clientIdAnalysis?.possibleIssues?.includes('Client ID可能关联了YouTube服务'),
                             clientIdValid: data.diagnostics.clientIdAnalysis?.format === 'valid'
                         }
                     }, true);
                     
                     // 如果检测到潜在问题，显示特别提示
                     if (data.diagnostics.clientIdAnalysis?.possibleIssues?.length > 0) {
                         updateStatus('⚠️ 检测到潜在配置问题，请查看诊断结果', 'warning');
                     }
                 } else {
                     updateStatus('❌ OAuth流程诊断失败', 'error');
                     addTestResult('OAuth流程诊断', data, false);
                 }
             } catch (error) {
                 updateStatus('❌ OAuth诊断连接失败', 'error');
                 addTestResult('OAuth流程诊断', { 
                     error: error.message,
                     suggestion: '请检查网络连接或稍后重试'
                 }, false);
             } finally {
                 hideLoading();
             }
         }

         // 页面加载完成后的初始化
         document.addEventListener('DOMContentLoaded', async function() {
             updateStatus('🎭 正在初始化支付系统测试工具...', 'info');
             await checkAuthStatus();
         });
    </script>
</body>
</html>
