        stroke-linecap="round" 
        fill="none"/>
  
  <!-- Letter P - 放大，增加间距 -->
  <path d="M78 33 L78 89 M78 33 L92 33 C99 33, 106 40, 106 47 L106 54 C106 61, 99 68, 92 68 L78 68" 
        stroke="white" 
        stroke-width="6" 
